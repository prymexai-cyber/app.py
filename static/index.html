<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yasiru Gems Lab</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<script>
/* apply the saved theme before the page paints */
(function(){ try{ var t=localStorage.getItem('ygl_theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
</script>
<style>
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --panel2:#F6F8FB; --ink:#0F1B2D; --muted:#56657A; --line:#D3DCE5;
  --accent:#2347B5; --accent-ink:#FFFFFF; --ruby:#A8143A; --emerald:#0B7A5A; --amber:#9A6200;
  --ic1:#16325F; --ic2:#0E9F6E;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.06);
  --radius:16px;
  --head:'Bricolage Grotesque','Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif;
  --body:'Figtree','Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#262624;--panel:#30302E;--panel2:#292927;--ink:#F5F4EE;--muted:#A9A79E;--line:#43423D;
    --accent:#3DD68C;--accent-ink:#1A1A18;--ruby:#FF8A8A;--emerald:#3DD68C;--amber:#F2C063;--shadow:none;--ic1:#FFFFFF;--ic2:#3DD68C}
}
:root[data-theme="dark"]{--bg:#262624;--panel:#30302E;--panel2:#292927;--ink:#F5F4EE;--muted:#A9A79E;--line:#43423D;
    --accent:#3DD68C;--accent-ink:#1A1A18;--ruby:#FF8A8A;--emerald:#3DD68C;--amber:#F2C063;--shadow:none;--ic1:#FFFFFF;--ic2:#3DD68C}
/* two-tone icons: navy + green in light, white + green in dark */
.ico .i1{stroke:var(--ic1)} .ico .i2{stroke:var(--ic2)} .ico .f2{fill:var(--ic2)} .ico .f1{fill:var(--ic1)}

*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .2s,color .2s}
.wrap{max-width:1060px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,5.5vw,2.8rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700}
.brand svg{width:38px;height:38px}
.controls{display:flex;gap:8px;align-items:center}
.controls select{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:190px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.iconbtn svg{width:18px;height:18px}
.hero{padding:6px 0 18px}
.hero .sub{color:var(--accent);font-weight:600;margin-top:6px}
.lead{color:var(--muted);max-width:68ch;margin:8px 0 0}
.engines{color:var(--muted);font-size:.86rem;margin-top:8px}
.translating{display:none;color:var(--amber);font-size:.9rem;margin-top:6px}
.translating.on{display:block}

/* cards */
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:16px;box-shadow:var(--shadow)}
.card > h2{margin-bottom:4px}
.note{color:var(--muted);font-size:.92rem;margin:4px 0 0}

/* media */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;cursor:pointer;
  background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile svg{width:30px;height:30px}
.tile b{font-family:var(--head);font-size:1.1rem}
.tile span{color:var(--muted);font-size:.86rem}
.tile.primary{border-color:var(--ic2);box-shadow:inset 0 0 0 1px var(--ic2)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:.9rem}
.drop.over{border-color:var(--accent);color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000;border:1.5px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:26px;padding:0}
.thumb .badge{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;border-radius:6px;padding:1px 6px}
.thumb .num{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:6px;padding:0 6px}
.mediacount{margin-top:8px;color:var(--muted);font-size:.9rem}

/* form */
details.grp{border:1.5px solid var(--line);border-radius:14px;padding:0 14px;margin-top:10px;background:var(--panel2)}
details.grp summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:'+';color:var(--accent);font-weight:700;width:14px}
details.grp[open] summary::before{content:'\2212'}
details.grp .filled{margin-left:auto;font-size:.78rem;color:var(--emerald);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-bottom:14px}
.fld label,.fld .lab{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
.fld input,.fld select,textarea{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
.fld.wide{grid-column:1/-1}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;padding-bottom:12px}
.choice label{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-size:.92rem}
.choice label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.subh{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.speakrow{display:flex;gap:8px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ruby);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:15px 26px;font-size:1.05rem}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:wait}
.busytext{color:var(--muted);font-size:.92rem;display:none}
.busytext.on{display:block}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px;display:none}
.progress.on{display:block}
.progress i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.progress i,.rec{animation:none}}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--ruby);color:var(--ruby);display:none;background:var(--panel)}
.err.on{display:block}

/* questions */
#qcard{display:none;border-color:var(--accent)}
#qcard.on{display:block}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600}
.q .why{color:var(--muted);font-size:.86rem}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-size:.92rem}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q input[type=text]{margin-top:8px;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}

/* report */
#report{display:none}
#report.on{display:block}
.rhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.meta{color:var(--muted);font-size:.88rem}
.idbox{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:92px;height:92px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:700;font-size:1.5rem;line-height:1}
.ring small{display:block;font-family:var(--body);font-size:.64rem;font-weight:500;color:var(--muted);margin-top:2px}
.idname{font-family:var(--head);font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;line-height:1.1}
.idsp{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;border:1.5px solid currentColor}
.pill.ok{color:var(--emerald)} .pill.warn{color:var(--amber)} .pill.bad{color:var(--ruby)} .pill.neutral{color:var(--muted)} .pill.acc{color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--panel2)}
.box h3{margin-bottom:8px}
.verdict{font-family:var(--head);font-size:1.25rem;font-weight:700;margin-bottom:6px}
.bars .bar{display:grid;grid-template-columns:minmax(90px,1.2fr) 2.4fr 46px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--accent)}
.fill.good{background:var(--emerald)} .fill.mid{background:var(--amber)} .fill.bad{background:var(--ruby)}
.pct{text-align:right;font-weight:600}
.sec{margin-top:22px}
.sec > h3{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.86rem}
.chip.miss{border-style:dashed;color:var(--muted)}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}
.warnbox{border:1.5px solid var(--amber);border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--amber) 9%,transparent)}
.warnbox ul,.box ul{margin:6px 0 0;padding-left:20px}
.tablewrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:start;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--panel2)}
tr:last-child td{border-bottom:0}
table.wide{min-width:860px}
.match{display:grid;grid-template-columns:minmax(130px,1.4fr) 3fr 46px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.countbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bignum{font-family:var(--head);font-size:2.8rem;font-weight:700;line-height:1}
.markstage{position:relative;display:inline-block;max-width:100%;line-height:0;cursor:crosshair;touch-action:manipulation;border-radius:10px;overflow:hidden;margin-top:10px}
.markstage img{max-width:100%;max-height:min(60vh,460px);display:block}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;border-radius:999px;border:2px solid #fff;
  background:var(--emerald);color:#fff;font:600 11px/18px var(--body);text-align:center;box-shadow:0 0 0 1.5px rgba(0,0,0,.55);cursor:pointer}
.conclusion{font-size:1.02rem;border-left:4px solid var(--accent);padding:8px 14px;background:var(--panel2);border-radius:0 12px 12px 0}
.disc{margin-top:18px;padding:12px 14px;border-radius:12px;border-left:4px solid var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);font-size:.88rem}
.credit{margin-top:36px;padding-top:16px;border-top:1.5px solid var(--line);color:var(--muted);font-size:.9rem;text-align:center}
.credit b{display:block;font-family:var(--head);color:var(--ink)}

/* client details */
.client{border-color:var(--ic2)}
.client .mgrid{padding-bottom:0;margin-top:12px}
.req{color:var(--ruby)}
.fld input.bad{border-color:var(--ruby)}

/* camera */
.modal{position:fixed;inset:0;background:rgba(4,8,16,.94);display:none;z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal video{width:100%;max-width:720px;max-height:68vh;border-radius:12px;background:#000;object-fit:cover}
.modal .row{justify-content:center}
.modal .btn.ghost{color:#fff;border-color:#fff}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#2347B5;padding:0}
.camcount{color:#fff;margin-top:8px;font-size:.9rem}

/* one-page PDF sheet: always light, A4 at 96 dpi */
#pdfhost{position:fixed;left:-10000px;top:0;pointer-events:none}
.a4{--navy:#16325F;--green:#0E9F6E;--grey:#5E6878;--rule:#DCE2EA;width:794px;height:1123px;background:#fff;color:#1B2433;
  font-family:'Figtree',Helvetica,Arial,sans-serif;padding:40px 46px 30px;position:relative;overflow:hidden;font-size:var(--fs,12.4px);line-height:1.42;display:flex;flex-direction:column}
.a4::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(var(--navy) 0 70%,var(--green) 70% 100%)}
.a4 .serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
.a4 .ph{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--navy)}
.a4 .pbrand{display:flex;gap:12px;align-items:center}
.a4 .pbrand svg{width:50px;height:50px}
.a4 .pname{font-size:1.32em;font-weight:700;color:var(--navy);letter-spacing:.32em}
.a4 .psub{font-size:.82em;color:var(--grey);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.a4 .pdoc{text-align:right}
.a4 .pdoc .serif{font-size:2.05em;font-weight:600;color:var(--navy);line-height:1}
.a4 .pdoc div{font-size:.86em;color:var(--grey);margin-top:4px}
.a4 .pdoc b{color:#1B2433}
.a4 .pclient{display:flex;gap:26px;flex-wrap:wrap;background:#F4F6F9;border-radius:4px;padding:8px 12px;margin-top:12px;font-size:.92em}
.a4 .pclient span{color:var(--grey);text-transform:uppercase;letter-spacing:.08em;font-size:.82em;margin-right:6px}
.a4 .ptitle{margin:16px 0 2px;font-size:2.5em;font-weight:600;color:var(--navy);line-height:1.05}
.a4 .ptsub{color:var(--grey);font-size:1em;letter-spacing:.04em}
.a4 .pgrid{display:grid;grid-template-columns:236px 1fr;gap:24px;margin-top:14px}
.a4 .pphotos{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.a4 .pphotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block;background:#F4F6F9}
.a4 .pphotos img:first-child{grid-column:1/-1;aspect-ratio:1}
.a4 table{width:100%;border-collapse:collapse;font-size:1em}
.a4 td{padding:4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.a4 td:first-child{color:var(--grey);width:38%;padding-right:10px}
.a4 td:last-child{font-weight:600}
.a4 td small{display:block;font-weight:400;color:var(--grey);font-size:.86em}
.a4 h4{font-size:.86em;margin:14px 0 4px;color:var(--green);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.a4 h4:first-child{margin-top:0}
.a4 .pconf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.a4 .pconf div{border:1px solid var(--rule);border-radius:3px;padding:6px 8px;font-size:.84em;color:var(--grey)}
.a4 .pconf b{display:block;font-size:1.7em;color:var(--navy);line-height:1.1}
.a4 .ptests{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.a4 .pcomm{margin:0}
.a4 ul{margin:0;padding-left:16px}
.a4 li{margin:1px 0}
.a4 .pcols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.a4 .psign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:14px}
.a4 .psign .line{width:210px;border-top:1px solid #1B2433;padding-top:3px;font-size:.84em;color:var(--grey);text-align:center}
.a4 .pfoot{border-top:1px solid var(--rule);margin-top:10px;padding-top:7px;font-size:.76em;color:var(--grey);display:flex;justify-content:space-between;gap:16px}
.a4 .pfoot p{margin:0;max-width:80%}

@media (max-width:760px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}.idbox{grid-template-columns:1fr;justify-items:start}.tile{flex-direction:row;align-items:center}.tile span{display:none}}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;margin:0;padding:0}
  .wrap,.modal{display:none!important}
  #pdfhost{position:static!important;left:0!important}
  #pdfhost .a4{page-break-after:avoid;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar no-print">
    <div class="brand">
      <svg class="ico" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="f2" d="M20 14h24l12 12H8z" opacity=".16" stroke="none"/><path class="i1" stroke-width="3.2" d="M20 14h24l12 12-24 32L8 26z"/><path class="i1" stroke-width="2.4" d="M8 26h48"/><path class="i2" stroke-width="2" d="M8 26 20 14l6 12 6-12 6 12 6-12 12 12M26 26l6 32 6-32M17 26l15 32 15-32"/><path class="f2" stroke="none" d="M53 2.5l1.7 4.8 4.8 1.7-4.8 1.7L53 15.5l-1.7-4.8L46.5 9l4.8-1.7z"/></svg>
      <span data-i18n="app_title">Yasiru Gems Lab</span>
    </div>
    <div class="controls">
      <label class="sr" for="langSel" style="position:absolute;left:-9999px" data-i18n="lang_label">Language</label>
      <select id="langSel" aria-label="Language"></select>
      <button class="iconbtn" id="themeBtn" type="button" data-i18n-title="theme_toggle" title="Switch light / dark theme">
        <svg id="themeIcon" class="ico" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"></svg>
        <span id="themeLabel"></span>
      </button>
    </div>
  </div>

  <header class="hero">
    <h1 data-i18n="app_title">Yasiru Gems Lab</h1>
    <div class="sub" data-i18n="app_sub">AI gem testing system</div>
    <p class="lead" data-i18n="lead"></p>
    <div class="engines" id="engines"></div>
    <div class="translating" id="translating" data-i18n="translating"></div>
  </header>

  <!-- 1. media -->
  <section class="card no-print" id="mediaCard">
    <h2 data-i18n="s1_title"></h2>
    <p class="note" data-i18n="s1_note"></p>
    <div class="tiles">
      <button class="tile primary" id="openCam" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="i1" d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle class="i2" cx="12" cy="13" r="3.8"/><path class="i2" d="M17.5 9h.01"/></svg>
        <b data-i18n="btn_camera"></b><span data-i18n="btn_camera_sub"></span>
      </button>
      <label class="tile" for="photoIn">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect class="i1" x="3" y="3" width="18" height="18" rx="2"/><circle class="i2" cx="9" cy="9" r="1.8"/><path class="i2" d="m21 15-5-5L5 21"/></svg>
        <b data-i18n="btn_photos"></b><span data-i18n="btn_photos_sub"></span>
      </label>
      <label class="tile" for="videoIn">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect class="i1" x="2" y="5" width="14" height="14" rx="2"/><path class="i2" d="m16 10 6-3v10l-6-3z"/><path class="i2" d="m7.5 9.5 4 2.5-4 2.5z"/></svg>
        <b data-i18n="btn_video"></b><span data-i18n="btn_video_sub"></span>
      </label>
    </div>
    <input type="file" id="photoIn" accept="image/*" multiple>
    <input type="file" id="videoIn" accept="video/*" multiple>
    <div class="drop" id="drop" data-i18n="drop_hint"></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="mediacount" id="mediacount"></div>
  </section>

  <!-- 2. test data -->
  <section class="card no-print" id="testCard">
    <h2 data-i18n="s2_title"></h2>
    <p class="note" data-i18n="s2_note"></p>

    <details class="grp" open>
      <summary><span data-i18n="g_free"></span></summary>
      <p class="note" style="margin-top:0" data-i18n="free_note"></p>
      <textarea id="m_free" maxlength="1500" data-i18n-ph="ph_free" style="margin-top:8px"></textarea>
      <div class="speakrow">
        <button class="btn ghost small" id="speakBtn" type="button"><span id="recDot"></span> <span id="speakLabel" data-i18n="btn_speak"></span></button>
        <span class="meta" id="speakMsg"></span>
      </div>
    </details>

    <details class="grp">
      <summary><span data-i18n="g_basic"></span><span class="filled" data-for="basic"></span></summary>
      <div class="mgrid" data-group="basic">
        <div class="fld wide"><label for="m_claim" data-i18n="f_claim"></label><input id="m_claim" type="text" maxlength="80" data-i18n-ph="ph_claim"></div>
        <div class="fld"><label for="m_weight" data-i18n="f_weight"></label><input id="m_weight" type="number" step="0.01" min="0" inputmode="decimal"></div>
        <div class="fld"><label for="m_shape" data-i18n="f_shape"></label><select id="m_shape"></select></div>
        <div class="fld"><label for="m_l" data-i18n="f_l"></label><input id="m_l" type="number" step="0.01" min="0" inputmode="decimal"></div>
        <div class="fld"><label for="m_w" data-i18n="f_w"></label><input id="m_w" type="number" step="0.01" min="0" inputmode="decimal"></div>
        <div class="fld"><label for="m_d" data-i18n="f_d"></label><input id="m_d" type="number" step="0.01" min="0" inputmode="decimal"></div>
      </div>
    </details>

    <details class="grp">
      <summary><span data-i18n="g_ri"></span><span class="filled" data-for="ri"></span></summary>
      <div class="mgrid" data-group="ri">
        <div class="fld"><label for="m_ri" data-i18n="f_ri"></label><input id="m_ri" type="text" inputmode="decimal" data-i18n-ph="ph_ri"></div>
        <div class="fld"><label for="m_biref" data-i18n="f_biref"></label><input id="m_biref" type="number" step="0.001" min="0" inputmode="decimal" data-i18n-ph="ph_biref"></div>
        <div class="fld"><label for="m_sg" data-i18n="f_sg"></label><input id="m_sg" type="text" inputmode="decimal" data-i18n-ph="ph_sg"></div>
        <div class="fld"><label for="m_thermal" data-i18n="f_thermal"></label><select id="m_thermal"></select></div>
        <div class="fld"><label for="m_moiss" data-i18n="f_moiss"></label><select id="m_moiss"></select></div>
      </div>
    </details>

    <details class="grp">
      <summary><span data-i18n="g_pol"></span><span class="filled" data-for="pol"></span></summary>
      <div data-group="pol">
        <div class="subh" data-i18n="f_pol"></div>
        <div class="choice" id="polChoice"></div>
        <div class="mgrid">
          <div class="fld"><label for="m_fig" data-i18n="f_fig"></label><select id="m_fig"></select></div>
          <div class="fld"><label for="m_pleo" data-i18n="f_pleo"></label><select id="m_pleo"></select></div>
          <div class="fld"><label for="m_chelsea" data-i18n="f_chelsea"></label><select id="m_chelsea"></select></div>
          <div class="fld"><label for="m_sign" data-i18n="f_sign"></label><select id="m_sign"></select></div>
          <div class="fld"><label for="m_magnet" data-i18n="f_magnet"></label><select id="m_magnet"></select></div>
          <div class="fld"><label for="m_uvl" data-i18n="f_uvl"></label><select id="m_uvl"></select></div>
          <div class="fld"><label for="m_uvs" data-i18n="f_uvs"></label><select id="m_uvs"></select></div>
        </div>
        <div class="subh" data-i18n="f_spec"></div>
        <div class="choice" id="specChoice"></div>
        <div class="subh" data-i18n="f_phen"></div>
        <div class="choice" id="phenChoice"></div>
      </div>
    </details>

    <details class="grp">
      <summary><span data-i18n="g_obs"></span><span class="filled" data-for="obs"></span></summary>
      <div class="choice" id="obsChoice" data-group="obs"></div>
    </details>

    <details class="grp">
      <summary><span data-i18n="g_lab"></span><span class="filled" data-for="lab"></span></summary>
      <p class="note" style="margin-top:0" data-i18n="lab_note"></p>
      <textarea id="m_lab" maxlength="2500" data-i18n-ph="ph_lab" style="margin:8px 0 14px" data-group="lab"></textarea>
    </details>

    <div class="row">
      <button class="btn big" id="analyzeBtn" type="button" data-i18n="btn_analyze"></button>
      <span class="busytext" id="busytext" data-i18n="busy"></span>
    </div>
    <div class="progress" id="progress"><i></i></div>
  </section>

  <div class="err no-print" id="err" role="alert"></div>

  <!-- follow-up questions -->
  <section class="card no-print" id="qcard" aria-live="polite">
    <h2 data-i18n="q_title"></h2>
    <p class="note" data-i18n="q_note"></p>
    <div id="qlist"></div>
    <div class="row">
      <button class="btn" id="reBtn" type="button" data-i18n="btn_reanalyze"></button>
      <span class="meta" id="qcount"></span>
    </div>
  </section>

  <!-- report -->
  <section id="report" aria-live="polite">
    <div class="card" id="sheet"></div>
    <div class="card client no-print" id="clientCard">
      <h2 data-i18n="c_title"></h2>
      <p class="note" data-i18n="c_note"></p>
      <div class="mgrid">
        <div class="fld"><label for="c_name"><span data-i18n="f_cname"></span> <span class="req">*</span></label><input id="c_name" type="text" maxlength="80" autocomplete="name" data-i18n-ph="ph_cname" required></div>
        <div class="fld"><label for="c_phone" data-i18n="f_cphone"></label><input id="c_phone" type="tel" maxlength="30" autocomplete="tel" placeholder="+44 20 7946 0000"></div>
        <div class="fld"><label for="c_email" data-i18n="f_cemail"></label><input id="c_email" type="email" maxlength="80" autocomplete="email" placeholder="name@example.com"></div>
      </div>
    </div>
    <div class="row no-print">
      <button class="btn" id="pdfBtn" type="button" data-i18n="btn_pdf"></button>
      <button class="btn ghost" id="printBtn" type="button" data-i18n="btn_print"></button>
      <button class="btn ghost" id="jsonBtn" type="button" data-i18n="btn_json"></button>
      <button class="btn ghost" id="newBtn" type="button" data-i18n="btn_new"></button>
    </div>
  </section>

  <footer class="credit">
    <b>Yasiru Gems &amp; Jewellery · Pryme x AI</b>
    <span data-i18n="dev">Developer: Yasiru Gunasinghe</span>
  </footer>
</div>

<div class="modal" id="camModal" role="dialog" aria-modal="true" aria-label="Camera">
  <video id="video" autoplay playsinline muted></video>
  <div class="camcount" id="camCount"></div>
  <div class="row">
    <button class="btn ghost" id="camFlip" type="button" data-i18n="cam_flip"></button>
    <button class="shutter" id="shutter" type="button" data-i18n-aria="cam_shot" aria-label="Take photo"></button>
    <button class="btn ghost" id="camClose" type="button" data-i18n="cam_done"></button>
  </div>
</div>

<div id="pdfhost" aria-hidden="true"></div>

<script src="i18n.js?v=6"></script>
<script src="app.js?v=7"></script>
</body>
</html>
